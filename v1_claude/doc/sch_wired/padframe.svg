<rect width="100%" height="100%" fill="white"/>
<text x="20" y="34" font-size="24" font-weight="bold">chip_top pad frame (slot 0p5x0p5, 1936 x 2531 um, physical order)</text>
<text x="20" y="56" font-size="12" fill="#444">Ring: DVDD / DVSS (I/O), VDD = DVDD, VSS = DVSS (core); the afe_rf block breaks the DVDD and VDD rings so that VDDA and VDDV get their own sections.</text>
<text x="20" y="72" font-size="12" fill="#444">Corners: gf180mcu_fd_io__cor x4; gaps: fill1/5/10/nc. NC = unused pad (asig_5p0 cell, no core connection); all 56 pads sit at the template bond positions.</text>
